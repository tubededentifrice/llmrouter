[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "llmrouter-backend"
version = "0.0.0"
description = "LLM Router web application"
requires-python = "==3.14.*"
dependencies = [
  "fastapi==0.140.13",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "uvicorn==0.51.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llmrouter_backend"]
