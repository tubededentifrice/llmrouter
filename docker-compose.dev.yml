# Localhost-only LLM Router development deployment.
# Start and stop this file through scripts/local-development.sh.

name: llmrouter-development

x-python-service: &python-service
  image: ghcr.io/astral-sh/uv:0.12.0-python3.14-trixie@sha256:31a52487b980ba38c38ee1d1eb21f416f974978794ad834af493aa734926bb94
  working_dir: /workspace
  environment:
    UV_LINK_MODE: copy
    UV_PROJECT_ENVIRONMENT: /python-environment/.venv
    UV_PYTHON_DOWNLOADS: never
  volumes:
    - .:/workspace:ro
    - llmrouter-python-environment:/python-environment
    - llmrouter-uv-cache:/root/.cache/uv

x-node-service: &node-service
  image: node:24.17.0-alpine@sha256:156b55f92e98ccd5ef49578a8cea0df4679826564bad1c9d4ef04462b9f0ded6
  working_dir: /workspace
  volumes:
    - .:/workspace:ro
    - ../opendle-ui:/opendle-ui
    - llmrouter-node-modules:/workspace/node_modules
    - llmrouter-admin-node-modules:/workspace/apps/admin/node_modules

services:
  postgres:
    image: postgres@sha256:5c855ad7b85e68e48a62f34662853f38b57c1c1d80f3a927ab58034fd6d31c5e
    restart: unless-stopped
    environment:
      POSTGRES_DB: llmrouter
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: llmrouter
    secrets:
      - postgres_password
    volumes:
      - llmrouter-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username llmrouter --dbname llmrouter"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 30

  migrate:
    <<: *python-service
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -euc
      - |
        export LLMROUTER_DATABASE_URL="postgresql://llmrouter:$$(cat /run/secrets/postgres_password)@postgres:5432/llmrouter"
        uv sync --frozen --all-packages --python /usr/local/bin/python
        /python-environment/.venv/bin/python scripts/local-development-migrate.py
    secrets:
      - postgres_password

  backend:
    <<: *python-service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      LLMROUTER_PUBLIC_ADMIN_AUTH: ${LLMROUTER_PUBLIC_ADMIN_AUTH:-0}
      LLMROUTER_OIDC_ISSUER: https://auth.opendle.dev
      LLMROUTER_OIDC_REDIRECT_URI: https://llmrouter.opendle.dev/v1/admin/oidc/callback
      LLMROUTER_ADMIN_SESSION_HOURS: "24"
      LLMROUTER_ADMIN_ALLOWED_ORIGINS: http://127.0.0.1:5174,https://llmrouter.opendle.dev
      LLMROUTER_OIDC_CLIENT_ID_FILE: /run/secrets/oidc_client_id
      LLMROUTER_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      LLMROUTER_ADMINISTRATOR_SUBJECTS_FILE: /run/secrets/administrator_subjects
      LLMROUTER_ADMIN_DIGEST_KEY_FILE: /run/secrets/administrator_digest_key
      LLMROUTER_ADMIN_ENCRYPTION_KEY_FILE: /run/secrets/administrator_encryption_key
    secrets:
      - postgres_password
      - oidc_client_id
      - oidc_client_secret
      - administrator_subjects
      - administrator_digest_key
      - administrator_encryption_key
    command:
      - /bin/sh
      - -euc
      - |
        export LLMROUTER_DATABASE_URL="postgresql://llmrouter:$$(cat /run/secrets/postgres_password)@postgres:5432/llmrouter"
        exec /python-environment/.venv/bin/uvicorn llmrouter_backend.app:app --host 0.0.0.0 --port 8000 --no-access-log
    ports:
      - "127.0.0.1:8010:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 30

  node-dependencies:
    <<: *node-service
    restart: "no"
    command:
      - /bin/sh
      - -euc
      - npm install --global npm@11.18.0 --no-audit --no-fund && npm ci --no-audit --no-fund

  admin-dev:
    <<: *node-service
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      node-dependencies:
        condition: service_completed_successfully
    environment:
      LLMROUTER_VITE_PROXY_ORIGIN: http://backend:8000
    command:
      - /bin/sh
      - -euc
      - npm run dev --workspace @llmrouter/admin -- --host 0.0.0.0
    ports:
      - "127.0.0.1:5174:5173"
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.llmrouter-dev.rule=Host(`llmrouter.opendle.dev`)"
      - "traefik.http.routers.llmrouter-dev.entrypoints=websecure"
      - "traefik.http.routers.llmrouter-dev.tls=true"
      - "traefik.http.routers.llmrouter-dev.tls.certresolver=letsencrypt"
      - "traefik.http.routers.llmrouter-dev.middlewares=badger@file"
      - "traefik.http.routers.llmrouter-dev.service=llmrouter-dev"
      - "traefik.http.services.llmrouter-dev.loadbalancer.server.port=5173"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:5173/"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 30

secrets:
  postgres_password:
    file: .local-development/postgres-password
  oidc_client_id:
    file: .local-development/pocket-id-client-id
  oidc_client_secret:
    file: .local-development/pocket-id-client-secret
  administrator_subjects:
    file: .local-development/pocket-id-administrator-subjects
  administrator_digest_key:
    file: .local-development/administrator-digest-key
  administrator_encryption_key:
    file: .local-development/administrator-encryption-key

networks:
  traefik-proxy:
    external: true

volumes:
  llmrouter-admin-node-modules:
  llmrouter-node-modules:
  llmrouter-postgres-data:
  llmrouter-python-environment:
  llmrouter-uv-cache:
