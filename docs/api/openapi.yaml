        model: {$ref: '#/components/schemas/AssignmentName'}
        choices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [index, message, finish_reason]
            properties:
              index: {type: integer, minimum: 0}
              message: {$ref: '#/components/schemas/Message'}
              finish_reason: {type: [string, 'null']}
        output: {type: array, items: {$ref: '#/components/schemas/ContentPart'}}
        usage: {$ref: '#/components/schemas/CompatibilityUsage'}
        x_llmrouter_request_id: {$ref: '#/components/schemas/UuidV7'}
        x_llmrouter_state: {$ref: '#/components/schemas/RequestState'}
        x_llmrouter_status_url: {type: string, format: uri}
    CompatibilityUsage:
      type: object
