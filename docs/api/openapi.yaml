components:
  securitySchemes:
    serviceKey:
      type: http
      scheme: bearer
      description: Long-lived backend service key.
    administratorSession:
      type: apiKey
      in: cookie
      name: llmrouter_admin_session
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 500
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    AuthorizationCode:
      name: code
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 2000
    OidcState:
      name: state
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 2000
    WorkspaceApiName:
      name: workspace_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiName"
    AssignmentApiName:
      name: assignment_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AssignmentName"
    ObservedRequirement:
      name: observed_requirement
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObservedRequirement"
    ServiceApiName:
      name: service_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiName"
    ProviderApiName:
      name: provider_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiName"
    ModelApiName:
      name: model_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiName"
    ProviderModelApiName:
      name: provider_model_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiName"
    CredentialApiName:
      name: credential_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiName"
    MediaJobId:
      name: media_job_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    RequestLogId:
      name: request_log_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    MediaId:
      name: media_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    StatisticsFrom:
      name: from
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Timestamp"
    StatisticsTo:
      name: to
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Timestamp"
    ServiceFilter:
      name: service
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ApiName"
    CallActorFilter:
      name: call_actor
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/CallActor"
    AdministratorFilter:
      name: administrator
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    ConfigurationServiceFilter:
      name: configuration_service
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ApiName"
    WorkspaceFilter:
      name: workspace
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ApiName"
    AssignmentFilter:
      name: assignment
      in: query
      required: false
      schema:
        oneOf:
          - $ref: "#/components/schemas/AssignmentName"
          - type: string
            const: "(exact)"
    ProviderModelFilter:
      name: provider_model
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ApiName"
    OutcomeFilter:
      name: outcome
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Outcome"
    TagFilter:
      name: tag
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Tag"
    GroupBy:
      name: group_by
      in: query
      required: false
      schema:
        type: array
        maxItems: 8
        uniqueItems: true
        items:
          $ref: "#/components/schemas/StatisticsDimension"
  responses:
    ErrorResponse:
      description: Standard API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceTreeInvalidRequestError:
      description: The requested root or parent relationship is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            root_parent:
              summary: A request tried to give the root service a parent.
              value:
                error:
                  code: invalid_request
                  message: The root service must not have a parent.
            missing_non_root_parent:
              summary: A request tried to make a non-root service parentless.
              value:
                error:
                  code: invalid_request
                  message: A non-root service must have a parent.
    ServiceParentNotFoundError:
      description: The named parent service does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: not_found
              message: Parent service was not found.
    ServiceOrParentNotFoundError:
      description: The target service or named parent service does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            target:
              summary: The target service does not exist.
              value:
                error:
                  code: not_found
                  message: Service was not found.
            parent:
              summary: The named parent service does not exist.
              value:
                error:
                  code: not_found
                  message: Parent service was not found.
    ServiceCreateConflictError:
      description: The service API name or current service tree prevents creation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            root_exists:
              summary: A request tried to create the reserved root service.
              value:
                error:
                  code: conflict
                  message: The root service already exists.
            api_name_exists:
              summary: Another service already uses the API name.
              value:
                error:
                  code: conflict
                  message: Service API name already exists.
            concurrent_change:
              summary: The service tree changed after relationship validation.
              value:
                error:
                  code: conflict
                  message: The service tree changed. Refresh and try again.
    ServiceUpdateConflictError:
      description: The requested parent change conflicts with the current service tree.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            cycle:
              summary: A parent change would create a service cycle.
              value:
                error:
                  code: conflict
                  message: The service parent would create a cycle.
            concurrent_change:
              summary: The service tree changed after relationship validation.
              value:
                error:
                  code: conflict
                  message: The service tree changed. Refresh and try again.
    ServiceDeleteConflictError:
      description: The protected root or a direct child prevents deletion.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            protected_root:
              summary: A request tried to delete the root service.
              value:
                error:
                  code: conflict
                  message: The root service cannot be deleted.
            child_services:
              summary: A delete target still has direct children.
              value:
                error:
                  code: conflict
                  message: Move or delete the child services first.
    ConfigurationDeletionValidationError:
      description: The configuration deletion request or resulting configuration is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigurationDeletionValidationErrorEnvelope"
          example:
            error:
              code: invalid_request
              message: Configuration deletion validation failed.
    ConfigurationDeletionTargetNotFoundError:
      description: The configuration deletion preview target does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigurationDeletionTargetNotFoundErrorEnvelope"
          example:
            error:
              code: not_found
              message: Configuration deletion target was not found.
    ConfigurationDeletionConflictError:
      description: The confirmation token cannot apply its exact reviewed deletion cascade.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigurationDeletionConflictErrorEnvelope"
          examples:
            expired_or_used:
              summary: The token expired or a successful confirmation already used it.
              value:
                error:
                  code: conflict
                  message: Configuration deletion confirmation is expired or was already used.
            configuration_changed:
              summary: The live cascade differs from the reviewed preview.
              value:
                error:
                  code: conflict
                  message: Configuration changed after the deletion preview. Create a new preview.
    ConfigurationDeletionStorageError:
      description: Storage could not apply the complete configuration deletion transaction.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigurationDeletionStorageErrorEnvelope"
          example:
            error:
              code: internal_error
              message: Configuration deletion was not applied.
    AdministratorErrorResponse:
      description: Administrator playground API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdministratorErrorEnvelope"
  schemas:
    ApiName:
      type: string
      minLength: 1
      maxLength: 63
      pattern: "^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    AssignmentName:
      type: string
      minLength: 1
      maxLength: 127
      pattern: "^[a-z0-9][a-z0-9._-]*$"
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 200
    Timestamp:
      type: string
      format: date-time
    Tag:
      type: string
      minLength: 1
      maxLength: 128
      x-max-utf8-bytes: 128
    Tags:
      type: array
      maxItems: 32
      x-max-total-utf8-bytes: 2048
      items:
        $ref: "#/components/schemas/Tag"
    PageInfo:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: string
          minLength: 1
          maxLength: 500
    ErrorCode:
      type: string
      enum:
        - authentication_required
        - permission_denied
        - invalid_request
        - not_found
        - conflict
        - assignment_cycle
        - provider_unavailable
        - upstream_failed
        - content_unavailable
        - rate_limited
        - internal_error
    ErrorDetails:
      type: object
      additionalProperties: false
      properties:
        field:
