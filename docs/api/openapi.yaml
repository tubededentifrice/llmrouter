        expected_revision: {oneOf: [{$ref: '#/components/schemas/OpaqueId'}, {type: 'null'}]}
    BusinessToolCall:
      type: object
      additionalProperties: false
      required: [contract_version, operation_id, service_id, run_id, owner_epoch, tool_name, permitted_operation, input, deadline, tool_grant]
      properties:
        contract_version: {type: integer, const: 1}
        operation_id: {$ref: '#/components/schemas/OpaqueId'}
        service_id: {$ref: '#/components/schemas/OpaqueId'}
        workspace_id: {$ref: '#/components/schemas/OpaqueId'}
        run_id: {$ref: '#/components/schemas/UuidV7'}
        owner_epoch: {type: integer, minimum: 1}
        tool_name: {type: string, pattern: '^[a-z][a-z0-9._-]{0,99}$'}
        permitted_operation: {type: string, pattern: '^[a-z][a-z0-9._-]{0,99}$'}
