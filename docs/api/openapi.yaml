      properties:
        api_name:
          $ref: "#/components/schemas/ApiName"
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        created_at:
          $ref: "#/components/schemas/Timestamp"
    WorkspacePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        page:
          $ref: "#/components/schemas/PageInfo"
    ReasoningLevel:
      type: string
      enum: [none, low, medium, high]
    ProviderModelCandidate:
      type: object
      additionalProperties: false
      required: [provider_model_api_name]
      properties:
        provider_model_api_name:
          $ref: "#/components/schemas/ApiName"
    AssignmentChain:
