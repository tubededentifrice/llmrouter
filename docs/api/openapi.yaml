        ended_at: {$ref: '#/components/schemas/Timestamp'}
        assignment_revision: {$ref: '#/components/schemas/OpaqueId'}
        decision:
          type: string
          description: The safe Router retry, fallback, or stop decision for a terminal attempt.
          enum: [next_candidate, stop_request, commit_boundary, cancelled, succeeded]
        error: {$ref: '#/components/schemas/TerminalError'}
        usage: {type: array, items: {$ref: '#/components/schemas/UsageComponent'}}
        price_version: {$ref: '#/components/schemas/OpaqueId'}
    ToolCallStatus:
      type: object
      additionalProperties: false
      required: [tool_call_id, tool_name, tool_kind, state]
      properties:
        tool_call_id: {$ref: '#/components/schemas/OpaqueId'}
        tool_name: {type: string}
        tool_kind: {type: string, enum: [shared, business]}
        state: {type: string, enum: [pending, running, succeeded, failed, cancelled, uncertain]}
        committed_effect: {type: boolean}
        error: {$ref: '#/components/schemas/TerminalError'}
    OutputResult:
      type: object
      additionalProperties: false
      required: [outputs]
