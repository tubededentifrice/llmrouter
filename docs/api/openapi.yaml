      properties:
        amount: {$ref: '#/components/schemas/NonNegativeDecimal'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    SignedMoney:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: {$ref: '#/components/schemas/Decimal'}
