        outcome:
          $ref: "#/components/schemas/Outcome"
        started_at:
          $ref: "#/components/schemas/Timestamp"
        completed_at:
          $ref: "#/components/schemas/Timestamp"
        usage:
          $ref: "#/components/schemas/Usage"
        applied_prices:
          $ref: "#/components/schemas/Price"
        response_json:
          type: string
          maxLength: 10000000
        error:
          $ref: "#/components/schemas/Error"
      oneOf:
        - properties:
            outcome:
              const: succeeded
          not:
            required: [error]
        - required: [error]
          properties:
            outcome:
              const: failed
