    get:
      tags: [Authentication]
      operationId: completeAdministratorSession
      summary: Validate the Pocket ID callback and create or refresh the local session.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 4096}
        - name: state
          in: query
          required: true
          schema: {type: string, minLength: 32, maxLength: 4096}
        - name: iss
          in: query
          required: true
          schema: {type: string, enum: ['https://auth.opendle.dev']}
        - name: scope
          in: query
          required: true
          schema: {type: string, enum: ['openid offline_access']}
      responses:
        '303':
          description: Authentication completed. The response sets the local session cookie and redirects to the validated local return path.
          headers:
            Location:
              required: true
              schema: {type: string}
            Set-Cookie:
              required: true
              schema:
                type: string
                description: Secure, HttpOnly, SameSite=Lax, host-only administrator session cookie with a maximum age of seven days.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Retryable'}
