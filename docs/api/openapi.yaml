      properties:
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
    RequestState:
      type: string
      enum: [admitted, running, waiting_for_tool, cancel_requested, succeeded, failed, interrupted, cancelled, uncertain]
    AdmissionReceipt:
      type: object
      additionalProperties: false
      required: [request_id, admitted_at, state, state_revision, status_url, cancel_url, fingerprint_version, capture_enabled, capture_reason]
      properties:
        request_id: {$ref: '#/components/schemas/UuidV7'}
        run_id: {$ref: '#/components/schemas/OpaqueId'}
        admitted_at: {$ref: '#/components/schemas/Timestamp'}
        state: {$ref: '#/components/schemas/RequestState'}
        state_revision: {type: integer, minimum: 1}
        status_url: {type: string, format: uri}
        cancel_url: {type: string, format: uri}
        events_url: {type: string, format: uri}
        fingerprint_version: {type: string, const: rfc8785-sha256-v1}
        capture_enabled: {type: boolean}
        capture_reason: {type: string, enum: [configured, spool_pressure]}
    CancelRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    RequestStatus:
      type: object
      additionalProperties: false
      required: [request_id, state, state_revision, admitted_at, last_transition_at, partial_output, committed_effects, configuration_revision, admission, attempts, tool_calls, accounting]
      oneOf:
        - required: [assignment]
          properties:
            assignment: {}
            exact_route: {}
          not:
            required: [exact_route]
        - required: [exact_route]
          properties:
            assignment: {}
            exact_route: {}
          not:
            required: [assignment]
      properties:
        request_id: {$ref: '#/components/schemas/UuidV7'}
        run_id: {$ref: '#/components/schemas/OpaqueId'}
        state: {$ref: '#/components/schemas/RequestState'}
        state_revision: {type: integer, minimum: 1}
        admitted_at: {$ref: '#/components/schemas/Timestamp'}
        last_transition_at: {$ref: '#/components/schemas/Timestamp'}
        terminal_at: {$ref: '#/components/schemas/Timestamp'}
        partial_output: {type: boolean}
        committed_effects: {type: boolean}
        configuration_revision: {$ref: '#/components/schemas/OpaqueId'}
        assignment: {$ref: '#/components/schemas/AssignmentName'}
        exact_route: {$ref: '#/components/schemas/OpaqueId'}
        admission: {$ref: '#/components/schemas/AdmissionReceipt'}
        owner_epoch: {type: integer, minimum: 1}
        attempts: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/AttemptStatus'}}
        tool_calls: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ToolCallStatus'}}
        result: {$ref: '#/components/schemas/OutputResult'}
        error: {$ref: '#/components/schemas/TerminalError'}
        accounting: {$ref: '#/components/schemas/RequestAccounting'}
    AttemptStatus:
      type: object
