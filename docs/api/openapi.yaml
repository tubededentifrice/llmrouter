    PutBudgetCeiling:
      type: object
      additionalProperties: false
      required: [amount, currency, expected_revision, reason]
      properties:
        amount: {$ref: '#/components/schemas/NonNegativeDecimal'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        expected_revision: {oneOf: [{$ref: '#/components/schemas/OpaqueId'}, {type: 'null'}]}
        reason: {type: string, minLength: 1, maxLength: 500}
    BudgetCeiling:
      type: object
      additionalProperties: false
      required: [service_id, workspace_id, amount, currency, revision, effective_at, operation_id]
      properties:
        service_id: {$ref: '#/components/schemas/OpaqueId'}
        workspace_id: {$ref: '#/components/schemas/OpaqueId'}
        amount: {$ref: '#/components/schemas/NonNegativeDecimal'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        revision: {$ref: '#/components/schemas/OpaqueId'}
        effective_at: {$ref: '#/components/schemas/Timestamp'}
        operation_id: {$ref: '#/components/schemas/OpaqueId'}
