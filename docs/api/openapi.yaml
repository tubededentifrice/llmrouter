components:
  securitySchemes:
    serviceKey:
      type: http
      scheme: bearer
      description: Long-lived backend service key.
    administratorSession:
      type: apiKey
      in: cookie
      name: llmrouter_admin_session
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 500
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    AuthorizationCode:
      name: code
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 2000
    OidcState:
      name: state
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 2000
    WorkspaceApiName:
      name: workspace_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiName"
    AssignmentApiName:
      name: assignment_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AssignmentName"
    ObservedRequirement:
      name: observed_requirement
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObservedRequirement"
    ServiceApiName:
      name: service_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiName"
    ProviderApiName:
      name: provider_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiName"
    ModelApiName:
      name: model_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiName"
    ProviderModelApiName:
      name: provider_model_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiName"
    CredentialApiName:
      name: credential_api_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiName"
    MediaJobId:
      name: media_job_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    RequestLogId:
      name: request_log_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    MediaId:
      name: media_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    StatisticsFrom:
      name: from
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Timestamp"
    StatisticsTo:
      name: to
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Timestamp"
    ServiceFilter:
      name: service
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ApiName"
    WorkspaceFilter:
      name: workspace
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ApiName"
    AssignmentFilter:
      name: assignment
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AssignmentName"
    ProviderModelFilter:
      name: provider_model
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ApiName"
    OutcomeFilter:
      name: outcome
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Outcome"
    TagFilter:
      name: tag
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Tag"
    GroupBy:
      name: group_by
      in: query
      required: false
      schema:
        type: array
        maxItems: 8
        uniqueItems: true
        items:
          $ref: "#/components/schemas/StatisticsDimension"
  responses:
    ErrorResponse:
      description: Standard API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ApiName:
      type: string
      minLength: 1
      maxLength: 63
      pattern: "^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    AssignmentName:
      type: string
      minLength: 1
      maxLength: 127
      pattern: "^[a-z0-9][a-z0-9._-]*$"
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 200
    Timestamp:
      type: string
      format: date-time
    Tag:
      type: string
      minLength: 1
      maxLength: 128
      x-max-utf8-bytes: 128
    Tags:
      type: array
      maxItems: 32
      x-max-total-utf8-bytes: 2048
      items:
        $ref: "#/components/schemas/Tag"
    PageInfo:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: string
          minLength: 1
          maxLength: 500
    ErrorCode:
      type: string
      enum:
        - authentication_required
        - permission_denied
        - invalid_request
        - not_found
        - conflict
        - assignment_cycle
        - provider_unavailable
        - upstream_failed
        - content_unavailable
        - rate_limited
        - internal_error
    ErrorDetails:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 200
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
          maxLength: 1000
        details:
          $ref: "#/components/schemas/ErrorDetails"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    HealthStatus:
      type: string
      enum: [healthy, degraded, unavailable]
    HealthSummary:
      type: object
      additionalProperties: false
      required: [status, checked_at]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        checked_at:
          $ref: "#/components/schemas/Timestamp"
    WorkspaceCreate:
      type: object
      additionalProperties: false
      required: [api_name, display_name]
      properties:
        api_name:
          $ref: "#/components/schemas/ApiName"
        display_name:
          type: string
          minLength: 1
          maxLength: 200
    Workspace:
      type: object
      additionalProperties: false
      required: [api_name, display_name, created_at]
      properties:
        api_name:
          $ref: "#/components/schemas/ApiName"
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        created_at:
          $ref: "#/components/schemas/Timestamp"
    WorkspacePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        page:
          $ref: "#/components/schemas/PageInfo"
    ReasoningLevel:
      type: string
      enum: [none, low, medium, high]
    ProviderModelCandidate:
      type: object
      additionalProperties: false
      required: [provider_model_api_name]
      properties:
        provider_model_api_name:
          $ref: "#/components/schemas/ApiName"
    AssignmentChain:
      type: array
      minItems: 1
      maxItems: 16
      uniqueItems: true
      items:
        $ref: "#/components/schemas/ProviderModelCandidate"
    EffectiveAssignmentChain:
      type: array
      minItems: 0
      maxItems: 16
      uniqueItems: true
      items:
        $ref: "#/components/schemas/ProviderModelCandidate"
    ObservedRequirement:
      type: string
      enum:
        - text_input
        - image_input
        - text_output
        - structured_json_output
        - tool_calling
        - streaming
        - reasoning
        - embedding_output
        - image_output
        - video_output
        - audio_output
    AssignmentDefinitionKind:
      type: string
      enum: [implicit, inherited_assignment, direct_chain]
    AssignmentWrite:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        inherits_assignment_api_name:
          $ref: "#/components/schemas/AssignmentName"
        direct_chain:
          $ref: "#/components/schemas/AssignmentChain"
        reasoning_level:
          $ref: "#/components/schemas/ReasoningLevel"
      oneOf:
        - required: [inherits_assignment_api_name]
          not:
            required: [direct_chain]
        - required: [direct_chain]
          not:
            required: [inherits_assignment_api_name]
    Assignment:
      type: object
      additionalProperties: false
      required: [api_name, display_name, definition_kind, effective_chain, observed_requirements]
      properties:
        api_name:
          $ref: "#/components/schemas/AssignmentName"
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        definition_kind:
          $ref: "#/components/schemas/AssignmentDefinitionKind"
        defined_by_service_api_name:
          $ref: "#/components/schemas/ApiName"
        inherits_assignment_api_name:
          $ref: "#/components/schemas/AssignmentName"
        direct_chain:
          $ref: "#/components/schemas/AssignmentChain"
        effective_chain:
          $ref: "#/components/schemas/EffectiveAssignmentChain"
        reasoning_level:
          $ref: "#/components/schemas/ReasoningLevel"
        observed_requirements:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ObservedRequirement"
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
      oneOf:
        - required: [definition_kind]
          properties:
            definition_kind:
              const: implicit
          not:
            anyOf:
              - required: [inherits_assignment_api_name]
              - required: [direct_chain]
        - required: [definition_kind, inherits_assignment_api_name]
          properties:
            definition_kind:
              const: inherited_assignment
          not:
            anyOf:
              - required: [direct_chain]
        - required: [definition_kind, direct_chain]
          properties:
            definition_kind:
              const: direct_chain
          not:
            anyOf:
              - required: [inherits_assignment_api_name]
    AssignmentPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
        page:
          $ref: "#/components/schemas/PageInfo"
    AssignmentSelector:
      type: object
      additionalProperties: false
      required: [assignment_api_name]
      properties:
        assignment_api_name:
          $ref: "#/components/schemas/AssignmentName"
    ExactProviderModelSelector:
      type: object
      additionalProperties: false
      required: [provider_model_api_name]
      properties:
        provider_model_api_name:
          $ref: "#/components/schemas/ApiName"
    ModelSelector:
      oneOf:
        - $ref: "#/components/schemas/AssignmentSelector"
        - $ref: "#/components/schemas/ExactProviderModelSelector"
    TextInputPart:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          const: text
        text:
          type: string
          minLength: 1
          maxLength: 1000000
    ImageInputPart:
      type: object
      additionalProperties: false
      required: [type, media_type, data_base64]
      properties:
        type:
          const: image
        media_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        data_base64:
          type: string
          format: byte
          minLength: 1
          maxLength: 27962028
          x-max-decoded-bytes: 20971520
    ToolResultPart:
      type: object
      additionalProperties: false
      required: [type, tool_call_id, result_json]
      properties:
        type:
          const: tool_result
        tool_call_id:
          $ref: "#/components/schemas/OpaqueId"
        result_json:
          type: string
          minLength: 1
          maxLength: 1000000
    UserContentPart:
