    bearerToken:
      type: http
      scheme: bearer
    administratorSession:
      type: apiKey
      in: cookie
      name: __Host-llmrouter-admin
    embedSession:
      type: apiKey
      in: cookie
      name: __Host-llmrouter-embed
      description: >-
        Write-only browser authority set during bootstrap. It is valid only
        from the exact Router frame origin bound to the unexpired,
        non-revoked embed session and cannot authorize global administration.
  parameters:
    ServiceId:
      name: service_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueId'}
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueId'}
    WorkspaceIdQuery:
      name: workspace_id
      in: query
      required: false
      schema: {$ref: '#/components/schemas/OpaqueId'}
    RequestId:
      name: request_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UuidV7'}
    LogicalRequestId:
      name: X-LLMRouter-Request-ID
      in: header
      required: true
      schema: {$ref: '#/components/schemas/UuidV7'}
      description: >-
        Client-generated logical request UUIDv7. It is the durable binding key
        and is not part of the provider-neutral request fingerprint.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 200}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 500}
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri, pattern: '^https?://[^/]+$'}
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema: {type: string, pattern: '^[0-9]+$'}
    From:
      name: from
      in: query
      required: true
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      required: true
      schema: {type: string, format: date-time}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, maxLength: 1000}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 100}
  responses:
    Error:
      description: A documented error from the shared error catalog.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    BadRequest:
      description: Invalid request.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Unauthorized:
      description: Authentication failed or is too old.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Forbidden:
      description: The authenticated actor lacks exact scope.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    NotFound:
      description: The record is absent or hidden from this scope.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Conflict:
      description: Identity, state, revision, or ceiling conflict.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Gone:
      description: The identity or resource cannot be used again.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Unprocessable:
      description: The request is valid JSON but cannot execute under current configuration.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Retryable:
      description: Temporary failure. Retry only as errors.md permits.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    WorkspaceResult:
      description: Current workspace and stable operation receipt.
      content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}
    AdmissionCreated:
      description: Logical request admitted.
      content: {application/json: {schema: {$ref: '#/components/schemas/AdmissionReceipt'}}}
    AdmissionReplay:
      description: Identical replay returned the existing admission.
      content: {application/json: {schema: {$ref: '#/components/schemas/AdmissionReceipt'}}}
    RequestStatus:
      description: Current or terminal request status.
      content: {application/json: {schema: {$ref: '#/components/schemas/RequestStatus'}}}
    RequestStatusPage:
      description: Bounded logical request status page.
      content: {application/json: {schema: {$ref: '#/components/schemas/RequestStatusPage'}}}
    EmbeddingAdmissionCreated:
      description: Atomic embedding batch admitted.
      content: {application/json: {schema: {$ref: '#/components/schemas/EmbeddingAdmissionReceipt'}}}
    EmbeddingAdmissionReplay:
      description: Identical replay returned the existing embedding admission.
      content: {application/json: {schema: {$ref: '#/components/schemas/EmbeddingAdmissionReceipt'}}}
    EmbeddingStatus:
      description: Current or terminal atomic embedding batch status.
      content: {application/json: {schema: {$ref: '#/components/schemas/EmbeddingRequestStatus'}}}
    ConfigurationPage:
      description: Bounded configuration page.
      content: {application/json: {schema: {$ref: '#/components/schemas/ConfigurationPage'}}}
    ConfigurationWrite:
      description: Configuration revision published.
      content: {application/json: {schema: {$ref: '#/components/schemas/ConfigurationWriteResult'}}}
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 200
    UuidV7:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Timestamp:
      type: string
      format: date-time
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    NonNegativeDecimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
    PositiveDecimal:
      type: string
      pattern: '^([1-9][0-9]*)(\.[0-9]+)?$|^0\.[0-9]*[1-9][0-9]*$'
    ContractManifest:
      type: object
      additionalProperties: false
      required: [contract_set, version, generated_at, capabilities, artifacts]
      properties:
        contract_set: {type: string, const: llmrouter-v1}
        version: {type: string, pattern: '^[1-9][0-9]*\.[0-9]+\.[0-9]+$'}
        generated_at: {$ref: '#/components/schemas/Timestamp'}
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [model_requests, embedding_requests_v1, agent_runs, shared_tools, attachments, request_status, request_discovery, cancellation, sse_stream_v1, workspace_lifecycle, host_budget_ceiling, effective_configuration, assignment_configuration, provider_instance_configuration, provider_model_route_configuration, price_synchronization, budget_management, retention_management, configuration_revisions, business_tool_gateway, diagnostic_routing, administration_authentication, service_administration, catalog_administration, credential_administration, administrator_grants, operational_administration, audit_discovery, captured_content, protected_exports, accounting_summary, detailed_health, openai_chat_completions, openai_responses]
        artifacts:
          type: array
          items: {$ref: '#/components/schemas/ContractArtifact'}
    ContractArtifact:
      type: object
      additionalProperties: false
      required: [name, version, major_version, sha256]
      properties:
        name: {type: string, enum: [openapi, stream_protocol, error_catalog, service_management, embed_protocol, embedding_protocol, business_tool_gateway, request_fingerprint, cross_service_conformance]}
        version: {type: string, pattern: '^[1-9][0-9]*\.[0-9]+\.[0-9]+$'}
        major_version: {type: integer, minimum: 1}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    ServiceTokenExchange:
      type: object
      additionalProperties: false
      required: [service_id, bootstrap_secret, audience, operations]
      properties:
        service_id: {$ref: '#/components/schemas/OpaqueId'}
        bootstrap_secret: {type: string, minLength: 43, maxLength: 200, pattern: '^[A-Za-z0-9_-]+$', writeOnly: true}
        audience: {type: string, enum: [data_plane, service_management, host_backend, accounting, configuration, budget_authority]}
        workspace_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: {$ref: '#/components/schemas/OpaqueId'}
        operations:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [model.create, model.read, model.cancel, embedding.create, embedding.read, run.create, run.read, run.cancel, tool.create, tool.read, tool.cancel, attachment.create, attachment.read, workspace.create, workspace.read, workspace.disable, workspace.restore, workspace.retire, admin_embed.create, accounting.read, configuration.read, configuration.write, diagnostic.grant.create, retention.read, retention.preview, retention.write, budget.read, budget.write, budget_ceiling.read, budget_ceiling.write]
    ServiceToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, service_id, audience, operations, credential_generation]
      properties:
        access_token: {type: string, minLength: 43, maxLength: 200, pattern: '^[A-Za-z0-9_-]+$', writeOnly: true}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer, const: 300}
        service_id: {$ref: '#/components/schemas/OpaqueId'}
        workspace_ids:
          type: array
          items: {$ref: '#/components/schemas/OpaqueId'}
        audience: {type: string}
        operations: {type: array, items: {type: string}}
        credential_generation: {type: integer, minimum: 1}
    CreateWorkspace:
      type: object
      additionalProperties: false
      required: [caller_reference, display_name]
      properties:
        caller_reference: {type: string, minLength: 1, maxLength: 200}
        display_name: {type: string, minLength: 1, maxLength: 200}
    WorkspaceStateChange:
      type: object
      additionalProperties: false
      required: [expected_state_revision, reason]
      properties:
        expected_state_revision: {$ref: '#/components/schemas/OpaqueId'}
        reason: {type: string, minLength: 1, maxLength: 500}
    Workspace:
      type: object
      additionalProperties: false
      required: [workspace_id, caller_reference, display_name, state, state_revision, operation_id]
      properties:
        workspace_id: {$ref: '#/components/schemas/OpaqueId'}
        caller_reference: {type: string}
        display_name: {type: string}
        state: {type: string, enum: [active, disabled, retired]}
        state_revision: {$ref: '#/components/schemas/OpaqueId'}
        operation_id: {$ref: '#/components/schemas/OpaqueId'}
    CreateAttachment:
      type: object
      additionalProperties: false
      required: [media_type, byte_length, sha256]
      properties:
        workspace_id: {$ref: '#/components/schemas/OpaqueId'}
        media_type:
          type: string
          enum: [text/plain, text/markdown, application/json, application/pdf, image/jpeg, image/png, image/webp, audio/mpeg, audio/wav]
        byte_length: {type: integer, minimum: 1, maximum: 26214400}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    Attachment:
      type: object
      additionalProperties: false
      required: [attachment_id, service_id, media_type, byte_length, sha256, state, expires_at]
      properties:
        attachment_id: {$ref: '#/components/schemas/OpaqueId'}
        service_id: {$ref: '#/components/schemas/OpaqueId'}
        workspace_id: {$ref: '#/components/schemas/OpaqueId'}
        media_type: {type: string}
        byte_length: {type: integer, minimum: 1, maximum: 26214400}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        state: {type: string, enum: [awaiting_content, ready, expired]}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    DataProfile:
      type: string
      const: service-data
    AssignmentName:
      type: string
      pattern: '^[a-z][a-z0-9.-]{0,99}$'
    Message:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: {type: string, enum: [system, user, assistant, tool]}
        content:
          oneOf:
            - {type: string, maxLength: 1048576}
            - type: array
              maxItems: 100
              items: {$ref: '#/components/schemas/ContentPart'}
    ContentPart:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, text]
          properties:
            type: {type: string, const: text}
            text: {type: string, maxLength: 1048576}
        - type: object
          additionalProperties: false
          required: [type, attachment_id, sha256, media_type]
          properties:
            type: {type: string, const: image}
            attachment_id: {$ref: '#/components/schemas/OpaqueId'}
            sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            media_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
        - type: object
          additionalProperties: false
          required: [type, attachment_id, sha256, media_type]
          properties:
            type: {type: string, const: audio}
            attachment_id: {$ref: '#/components/schemas/OpaqueId'}
            sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            media_type: {type: string, enum: [audio/mpeg, audio/wav]}
        - type: object
          additionalProperties: false
          required: [type, attachment_id, sha256, media_type]
          properties:
            type: {type: string, const: file}
            attachment_id: {$ref: '#/components/schemas/OpaqueId'}
            sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            media_type: {type: string, enum: [text/plain, text/markdown, application/json, application/pdf]}
    ToolDefinition:
      type: object
      additionalProperties: false
      required: [name, description, input_schema_name, input_schema_major_version]
      properties:
        name: {type: string, pattern: '^[a-zA-Z][a-zA-Z0-9_.-]{0,99}$'}
        description: {type: string, maxLength: 4000}
        input_schema_name: {type: string, pattern: '^[a-z][a-z0-9._-]{0,99}$'}
        input_schema_major_version: {type: integer, minimum: 1}
    RequestLimits:
      type: object
      additionalProperties: false
      required: [attempt_timeout_ms, max_output_units]
      properties:
        attempt_timeout_ms: {type: integer, minimum: 100, maximum: 120000}
        max_output_units: {type: integer, minimum: 1, maximum: 1000000}
        max_cost: {$ref: '#/components/schemas/Money'}
        logical_timeout_ms: {type: integer, const: 900000}
    OutputControls:
      type: object
      additionalProperties: false
      properties:
        format: {type: string, enum: [text, json]}
        json_schema_name: {type: string, pattern: '^[a-z][a-z0-9._-]{0,99}$'}
        json_schema_major_version: {type: integer, minimum: 1}
        temperature: {type: number, minimum: 0, maximum: 2}
    ModelRequest:
      type: object
      additionalProperties: false
      description: A request can reference at most 20 attachments and 104857600 attachment bytes in total.
      required: [api_version, data_profile, messages, limits, output]
      oneOf:
        - required: [assignment]
          not:
            anyOf:
              - required: [exact_route]
              - required: [exact_route_grant]
        - required: [exact_route, exact_route_grant]
          not:
            required: [assignment]
      properties:
        api_version: {type: string, const: '1', x-router-fingerprint: true}
        data_profile: {$ref: '#/components/schemas/DataProfile', x-router-fingerprint: true}
        workspace_id: {$ref: '#/components/schemas/OpaqueId', x-router-fingerprint: true}
        assignment: {$ref: '#/components/schemas/AssignmentName', x-router-fingerprint: true}
        exact_route: {$ref: '#/components/schemas/OpaqueId', x-router-fingerprint: true}
        exact_route_grant: {type: string, writeOnly: true, x-router-fingerprint: false}
        messages:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/Message'}
          x-router-fingerprint: true
        tools:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ToolDefinition'}
          x-router-fingerprint: true
        tool_allow_list:
          type: array
          uniqueItems: true
          items: {type: string}
          x-router-fingerprint: true
        limits: {$ref: '#/components/schemas/RequestLimits', x-router-fingerprint: true}
        output: {$ref: '#/components/schemas/OutputControls', x-router-fingerprint: true}
        trace_context: {$ref: '#/components/schemas/TraceContext', x-router-fingerprint: false}
    EmbeddingRequest:
      type: object
      additionalProperties: false
      description: The complete batch can contain no more than 262144 UTF-8 input bytes.
      required: [api_version, data_profile, assignment, input_policy_id, model_space_id, dimensions, inputs, timeout_ms]
      properties:
        api_version: {type: string, const: '1', x-router-fingerprint: true}
        data_profile: {type: string, const: service-data, x-router-fingerprint: true}
        assignment: {$ref: '#/components/schemas/AssignmentName', x-router-fingerprint: true}
        input_policy_id: {$ref: '#/components/schemas/OpaqueId', x-router-fingerprint: true}
        model_space_id: {$ref: '#/components/schemas/OpaqueId', x-router-fingerprint: true}
        dimensions: {type: integer, minimum: 1, maximum: 4096, x-router-fingerprint: true}
        inputs:
          type: array
          minItems: 1
          maxItems: 32
          x-max-total-utf8-bytes: 262144
          x-unique-property: input_id
          items: {$ref: '#/components/schemas/EmbeddingInput'}
          x-router-fingerprint: true
        timeout_ms: {type: integer, const: 120000, x-router-fingerprint: true}
        max_cost: {$ref: '#/components/schemas/Money', x-router-fingerprint: true}
        trace_context: {$ref: '#/components/schemas/TraceContext', x-router-fingerprint: false}
    EmbeddingInput:
      type: object
      additionalProperties: false
      required: [input_id, sha256, text]
      properties:
        input_id: {$ref: '#/components/schemas/OpaqueId'}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        text: {type: string, minLength: 1, maxLength: 32768, x-max-utf8-bytes: 32768}
    AgentRunRequest:
      type: object
      additionalProperties: false
      description: A run can reference at most 20 attachments and 104857600 attachment bytes in total.
      required: [api_version, data_profile, messages, limits, output, agent]
      oneOf:
        - required: [assignment]
          not:
            anyOf:
              - required: [exact_route]
              - required: [exact_route_grant]
        - required: [exact_route, exact_route_grant]
          not:
            required: [assignment]
      properties:
        api_version: {type: string, const: '1', x-router-fingerprint: true}
        data_profile: {$ref: '#/components/schemas/DataProfile', x-router-fingerprint: true}
        workspace_id: {$ref: '#/components/schemas/OpaqueId', x-router-fingerprint: true}
        assignment: {$ref: '#/components/schemas/AssignmentName', x-router-fingerprint: true}
        exact_route: {$ref: '#/components/schemas/OpaqueId', x-router-fingerprint: true}
        exact_route_grant: {type: string, writeOnly: true, x-router-fingerprint: false}
        messages:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/Message'}
          x-router-fingerprint: true
        tools:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ToolDefinition'}
          x-router-fingerprint: true
        tool_allow_list:
          type: array
          uniqueItems: true
          items: {type: string}
          x-router-fingerprint: true
        limits: {$ref: '#/components/schemas/RequestLimits', x-router-fingerprint: true}
        output: {$ref: '#/components/schemas/OutputControls', x-router-fingerprint: true}
        agent:
          type: object
          additionalProperties: false
          required: [max_steps, max_tool_concurrency]
          properties:
            max_steps: {type: integer, minimum: 1, maximum: 100}
            max_tool_concurrency: {type: integer, minimum: 1, maximum: 8, default: 1}
            business_tool_names:
              type: array
              uniqueItems: true
              maxItems: 100
              items: {type: string}
          x-router-fingerprint: true
        trace_context: {$ref: '#/components/schemas/TraceContext', x-router-fingerprint: false}
    SharedToolRequest:
      type: object
      additionalProperties: false
      required: [api_version, data_profile, assignment, tool, input, limits]
      properties:
        api_version: {type: string, const: '1', x-router-fingerprint: true}
        data_profile: {$ref: '#/components/schemas/DataProfile', x-router-fingerprint: true}
        workspace_id: {$ref: '#/components/schemas/OpaqueId', x-router-fingerprint: true}
        assignment: {$ref: '#/components/schemas/AssignmentName', x-router-fingerprint: true}
        tool: {type: string, enum: [search, extract, scrape, screenshot], x-router-fingerprint: true}
        input: {$ref: '#/components/schemas/RegisteredDocument', x-router-fingerprint: true}
        limits: {$ref: '#/components/schemas/RequestLimits', x-router-fingerprint: true}
        trace_context: {$ref: '#/components/schemas/TraceContext', x-router-fingerprint: false}
    CompatibleChatRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      oneOf:
        - not:
            anyOf:
              - required: [x_llmrouter_exact_route]
              - required: [x_llmrouter_exact_route_grant]
        - required: [x_llmrouter_exact_route, x_llmrouter_exact_route_grant]
      properties:
        model: {$ref: '#/components/schemas/AssignmentName', x-router-fingerprint: true}
        messages: {type: array, minItems: 1, maxItems: 1000, items: {$ref: '#/components/schemas/Message'}, x-router-fingerprint: true}
        tools: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ToolDefinition'}, x-router-fingerprint: true}
        tool_choice: {$ref: '#/components/schemas/CompatibilityToolChoice', x-router-fingerprint: true}
        response_format: {$ref: '#/components/schemas/CompatibilityResponseFormat', x-router-fingerprint: true}
        temperature: {type: number, minimum: 0, maximum: 2, x-router-fingerprint: true}
        max_completion_tokens: {type: integer, minimum: 1, maximum: 1000000, x-router-fingerprint: true}
        stream: {type: boolean, default: false, x-router-fingerprint: false}
        metadata: {$ref: '#/components/schemas/MetadataEntries', x-router-fingerprint: true}
        user: {type: string, maxLength: 200, x-router-fingerprint: true}
        x_llmrouter_workspace_id: {$ref: '#/components/schemas/OpaqueId', x-router-fingerprint: true}
        x_llmrouter_data_profile: {$ref: '#/components/schemas/DataProfile', x-router-fingerprint: true}
        x_llmrouter_max_cost: {$ref: '#/components/schemas/Money', x-router-fingerprint: true}
        x_llmrouter_exact_route: {$ref: '#/components/schemas/OpaqueId', x-router-fingerprint: true}
        x_llmrouter_exact_route_grant: {type: string, minLength: 43, maxLength: 200, writeOnly: true, x-router-fingerprint: false}
    CompatibleResponsesRequest:
      type: object
      additionalProperties: false
      required: [model, input]
      oneOf:
        - not:
            anyOf:
              - required: [x_llmrouter_exact_route]
              - required: [x_llmrouter_exact_route_grant]
        - required: [x_llmrouter_exact_route, x_llmrouter_exact_route_grant]
      properties:
        model: {$ref: '#/components/schemas/AssignmentName', x-router-fingerprint: true}
        input:
          oneOf:
            - {type: string, maxLength: 1048576}
            - {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/Message'}}
          x-router-fingerprint: true
        instructions: {type: string, maxLength: 1048576, x-router-fingerprint: true}
        tools: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ToolDefinition'}, x-router-fingerprint: true}
        tool_choice: {$ref: '#/components/schemas/CompatibilityToolChoice', x-router-fingerprint: true}
        text: {$ref: '#/components/schemas/CompatibilityResponseFormat', x-router-fingerprint: true}
        temperature: {type: number, minimum: 0, maximum: 2, x-router-fingerprint: true}
        max_output_tokens: {type: integer, minimum: 1, maximum: 1000000, x-router-fingerprint: true}
        stream: {type: boolean, default: false, x-router-fingerprint: false}
        metadata: {$ref: '#/components/schemas/MetadataEntries', x-router-fingerprint: true}
        user: {type: string, maxLength: 200, x-router-fingerprint: true}
        x_llmrouter_workspace_id: {$ref: '#/components/schemas/OpaqueId', x-router-fingerprint: true}
        x_llmrouter_data_profile: {$ref: '#/components/schemas/DataProfile', x-router-fingerprint: true}
        x_llmrouter_max_cost: {$ref: '#/components/schemas/Money', x-router-fingerprint: true}
        x_llmrouter_exact_route: {$ref: '#/components/schemas/OpaqueId', x-router-fingerprint: true}
        x_llmrouter_exact_route_grant: {type: string, minLength: 43, maxLength: 200, writeOnly: true, x-router-fingerprint: false}
    RegisteredDocument:
      type: object
      additionalProperties: false
      required: [schema_name, major_version, document]
      properties:
        schema_name: {type: string, pattern: '^[a-z][a-z0-9._-]{0,99}$'}
