        assignment: {$ref: '#/components/schemas/AssignmentName'}
        hard_limit: {$ref: '#/components/schemas/Money'}
        warning_threshold: {$ref: '#/components/schemas/Money'}
        reset_period: {type: string, enum: [none, daily, monthly]}
        expected_revision: {$ref: '#/components/schemas/BudgetRevision'}
