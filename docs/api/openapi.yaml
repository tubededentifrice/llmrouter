        - text_input
        - image_input
        - text_output
        - structured_json_output
        - tool_calling
        - streaming
        - reasoning
        - embedding_output
        - image_output
        - video_output
        - audio_output
    AssignmentDefinitionKind:
      type: string
      enum: [implicit, inherited_assignment, direct_chain]
    AssignmentWrite:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        inherits_assignment_api_name:
          $ref: "#/components/schemas/AssignmentName"
        direct_chain:
          $ref: "#/components/schemas/AssignmentChain"
        reasoning_level:
          $ref: "#/components/schemas/ReasoningLevel"
      oneOf:
        - required: [inherits_assignment_api_name]
          not:
            required: [direct_chain]
        - required: [direct_chain]
          not:
            required: [inherits_assignment_api_name]
    Assignment:
      type: object
      additionalProperties: false
      required: [api_name, display_name, definition_kind, effective_chain, observed_requirements]
      properties:
        api_name:
          $ref: "#/components/schemas/AssignmentName"
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        definition_kind:
          $ref: "#/components/schemas/AssignmentDefinitionKind"
        defined_by_service_api_name:
          $ref: "#/components/schemas/ApiName"
        inherits_assignment_api_name:
          $ref: "#/components/schemas/AssignmentName"
        direct_chain:
          $ref: "#/components/schemas/AssignmentChain"
        effective_chain:
          $ref: "#/components/schemas/EffectiveAssignmentChain"
        reasoning_level:
          $ref: "#/components/schemas/ReasoningLevel"
        observed_requirements:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ObservedRequirement"
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
      oneOf:
        - required: [definition_kind]
          properties:
            definition_kind:
              const: implicit
          not:
            anyOf:
              - required: [inherits_assignment_api_name]
              - required: [direct_chain]
        - required: [definition_kind, inherits_assignment_api_name]
          properties:
            definition_kind:
              const: inherited_assignment
          not:
            anyOf:
              - required: [direct_chain]
        - required: [definition_kind, direct_chain]
          properties:
            definition_kind:
              const: direct_chain
          not:
            anyOf:
              - required: [inherits_assignment_api_name]
    AssignmentPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
        page:
          $ref: "#/components/schemas/PageInfo"
    ConfigurationDeletionTargetKind:
      type: string
      enum:
        - provider
        - model
        - provider_model
        - credential
        - assignment
    ConfigurationDeletionResourceKind:
      type: string
      enum:
        - provider
        - model
        - provider_model
        - credential
        - model_price
        - provider_model_price
        - assignment
        - assignment_candidate_link
        - assignment_parent_reference
        - assignment_resolution
    ConfigurationDeletionOperation:
      type: string
      enum: [delete, change, retain]
    ConfigurationDeletionEffectKind:
      type: string
      enum:
        - delete
        - clear_credential_reference
        - remove_assignment_candidate_link
        - close_assignment_candidate_gap
        - keep_empty_direct_chain
        - clear_assignment_parent_reference
        - convert_to_empty_direct_chain
        - expose_inherited_assignment
        - expose_implicit_root_default
        - retain_shared_credential
        - change_effective_chain
        - become_unavailable
        - change_effective_routing
    ConfigurationDeletionTarget:
      type: object
      additionalProperties: false
      required: [kind, api_name]
      properties:
        kind:
          $ref: "#/components/schemas/ConfigurationDeletionTargetKind"
        api_name:
          type: string
          minLength: 1
          maxLength: 127
          description: The API identity of the target resource.
        service_api_name:
          $ref: "#/components/schemas/ApiName"
        display_label:
          type: string
          minLength: 1
          maxLength: 200
          readOnly: true
      oneOf:
        - required: [service_api_name]
          properties:
            kind:
              const: assignment
            api_name:
              $ref: "#/components/schemas/AssignmentName"
        - properties:
            kind:
              enum: [provider, model, provider_model, credential]
            api_name:
              $ref: "#/components/schemas/ApiName"
          not:
            required: [service_api_name]
    ConfigurationDeletionPreviewRequest:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          $ref: "#/components/schemas/ConfigurationDeletionTarget"
    ConfigurationDeletionEffect:
      type: object
      additionalProperties: false
      required: [resource_kind, api_name, operation, effects, description]
      properties:
        resource_kind:
          $ref: "#/components/schemas/ConfigurationDeletionResourceKind"
        api_name:
          type: string
          minLength: 1
          maxLength: 200
          description: The resource API identity. For a relation, this is the owning or child assignment API identity.
        service_api_name:
          $ref: "#/components/schemas/ApiName"
        provider_model_api_name:
          description: The other endpoint of an assignment candidate link.
          $ref: "#/components/schemas/ApiName"
        parent_assignment_api_name:
          description: The parent endpoint of an assignment-parent reference.
          $ref: "#/components/schemas/AssignmentName"
        display_label:
          type: string
          minLength: 1
          maxLength: 200
        operation:
          $ref: "#/components/schemas/ConfigurationDeletionOperation"
        effects:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ConfigurationDeletionEffectKind"
        description:
          type: string
          minLength: 1
          maxLength: 1000
          description: The exact human-readable effect that the administrator reviews.
        previous_effective_chain:
          $ref: "#/components/schemas/EffectiveAssignmentChain"
        resulting_effective_chain:
          $ref: "#/components/schemas/EffectiveAssignmentChain"
      oneOf:
        - required: [service_api_name, previous_effective_chain, resulting_effective_chain]
          properties:
            resource_kind:
              enum: [assignment, assignment_resolution]
          not:
            anyOf:
              - required: [provider_model_api_name]
              - required: [parent_assignment_api_name]
        - required: [service_api_name, provider_model_api_name]
          properties:
            resource_kind:
              const: assignment_candidate_link
          not:
            anyOf:
              - required: [parent_assignment_api_name]
              - required: [previous_effective_chain]
              - required: [resulting_effective_chain]
        - required: [service_api_name, parent_assignment_api_name]
          properties:
            resource_kind:
              const: assignment_parent_reference
          not:
            anyOf:
              - required: [provider_model_api_name]
              - required: [previous_effective_chain]
              - required: [resulting_effective_chain]
        - properties:
            resource_kind:
              enum:
                - provider
                - model
                - provider_model
                - credential
                - model_price
                - provider_model_price
          not:
            anyOf:
              - required: [service_api_name]
              - required: [provider_model_api_name]
              - required: [parent_assignment_api_name]
              - required: [previous_effective_chain]
              - required: [resulting_effective_chain]
    ConfigurationDeletionConfirmationToken:
