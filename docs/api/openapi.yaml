        contract_version: {type: integer, const: 1}
        operation_id: {$ref: '#/components/schemas/OpaqueId'}
        state: {type: string, enum: [succeeded, failed, uncertain]}
        effect_state: {type: string, enum: [none, committed, unknown]}
        result: {$ref: '#/components/schemas/RegisteredDocument'}
        safe_error: {$ref: '#/components/schemas/TerminalError'}
    BusinessToolReconciliationRequest:
      type: object
      additionalProperties: false
      required: [contract_version, operation_id, service_id, run_id, owner_epoch, reconciliation_grant]
      properties:
        contract_version: {type: integer, const: 1}
        operation_id: {$ref: '#/components/schemas/OpaqueId'}
        service_id: {$ref: '#/components/schemas/OpaqueId'}
        workspace_id: {$ref: '#/components/schemas/OpaqueId'}
        run_id: {$ref: '#/components/schemas/UuidV7'}
        owner_epoch: {type: integer, minimum: 1}
        reconciliation_grant: {type: string, minLength: 43, maxLength: 200, writeOnly: true}
    BusinessToolReconciliationResult:
      type: object
      additionalProperties: false
      required: [contract_version, operation_id, effect_state, evidence]
      properties:
        contract_version: {type: integer, const: 1}
        operation_id: {$ref: '#/components/schemas/OpaqueId'}
        effect_state: {type: string, enum: [not_started, committed, failed, unknown]}
        evidence: {$ref: '#/components/schemas/RegisteredDocument'}
    BusinessToolGatewayApproval:
      type: object
      additionalProperties: false
      required: [gateway_revision, decision, reason]
      properties:
        gateway_revision: {$ref: '#/components/schemas/OpaqueId'}
        decision: {type: string, enum: [approved, denied]}
        reason: {type: string, minLength: 1, maxLength: 500}
    BusinessToolGateway:
      type: object
      additionalProperties: false
      required: [service_id, origin, contract_major_versions, tool_kinds, network_policy_id, revision, approval_state]
      properties:
        service_id: {$ref: '#/components/schemas/OpaqueId'}
        origin: {type: string, format: uri, pattern: '^https://'}
        contract_major_versions: {type: array, uniqueItems: true, items: {type: integer, const: 1}}
        tool_kinds: {type: array, uniqueItems: true, items: {type: string, pattern: '^[a-z][a-z0-9._-]{0,99}$'}}
        network_policy_id: {$ref: '#/components/schemas/OpaqueId'}
        revision: {$ref: '#/components/schemas/OpaqueId'}
        approval_state: {type: string, enum: [pending, approved, denied]}
        approved_revision: {$ref: '#/components/schemas/OpaqueId'}
    CompatibleResponse:
      type: object
      additionalProperties: false
      required: [id, object, x_llmrouter_request_id, x_llmrouter_state, x_llmrouter_status_url]
      properties:
        id: {$ref: '#/components/schemas/OpaqueId'}
