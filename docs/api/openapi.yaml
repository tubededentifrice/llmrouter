openapi: 3.1.0
info:
  title: LLM Router native API
  version: 1.0.0
  summary: Provider-neutral routing, agent, tool, accounting, and administration API.
  description: >-
    This is the complete first-release HTTP JSON contract. Stream event details
    are in stream-protocol.md. Contract envelopes are closed. A declared JSON
    document field follows its own supplied schema.
servers:
  - url: /
security:
  - bearerToken: []
tags:
  - name: Contracts
    description: Safe runtime contract and capability discovery.
  - name: Authentication
    description: Service bootstrap exchange.
  - name: Workspaces
    description: Calling-service workspace scope management.
  - name: Requests
    description: Provider-neutral model requests and compatibility operations.
  - name: Embeddings
    description: Atomic workspace-scoped embedding batches.
  - name: Attachments
    description: Scoped immutable request content.
  - name: Runs
    description: Durable provider-neutral agent runs.
  - name: Tools
    description: Direct shared external-tool requests.
  - name: Configuration
    description: Effective and owned routing configuration.
  - name: Budgets
    description: Host ceilings, limits, and enforcement state.
  - name: Accounting
    description: Durable usage and cost aggregates.
  - name: Administration
    description: Global and service-scoped administration.
  - name: Audit
    description: Audit metadata and protected captured-content reads.
  - name: Health
    description: Safe readiness and operational state.
paths:
  /v1/contracts:
    get:
      tags: [Contracts]
      operationId: getContractManifest
      summary: Get safe contract versions, capabilities, and artifact digests.
      security: []
      responses:
        '200':
          description: Current deployed contract set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContractManifest'}
        default: {$ref: '#/components/responses/Error'}
  /v1/service-token-exchanges:
    post:
      tags: [Authentication]
      operationId: exchangeServiceToken
      summary: Exchange one bootstrap secret for a five-minute scoped token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceTokenExchange'}
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceToken'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/Retryable'}
  /v1/services/{service_id}/workspaces:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create one Router workspace scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspace'}
      responses:
        '200': {$ref: '#/components/responses/WorkspaceResult'}
        '201': {$ref: '#/components/responses/WorkspaceResult'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/services/{service_id}/workspaces/{workspace_id}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Get one workspace and its current state revision.
      responses:
        '200': {$ref: '#/components/responses/WorkspaceResult'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/services/{service_id}/workspaces/{workspace_id}/disable:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: disableWorkspace
      summary: Disable one workspace.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceStateChange'}
      responses:
        '200': {$ref: '#/components/responses/WorkspaceResult'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/services/{service_id}/workspaces/{workspace_id}/restore:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: restoreWorkspace
      summary: Restore one disabled workspace.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceStateChange'}
      responses:
        '200': {$ref: '#/components/responses/WorkspaceResult'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/services/{service_id}/workspaces/{workspace_id}/retire:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: retireWorkspace
      summary: Permanently retire one workspace identity.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceStateChange'}
      responses:
        '200': {$ref: '#/components/responses/WorkspaceResult'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/services/{service_id}/workspaces/{workspace_id}/budget-ceiling:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Budgets]
      operationId: getWorkspaceBudgetCeiling
      summary: Get the non-bypassable ceiling that the host service owns.
      responses:
        '200':
          description: Current ceiling.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetCeiling'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Budgets]
      operationId: putWorkspaceBudgetCeiling
      summary: Create or replace the non-bypassable host ceiling.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutBudgetCeiling'}
      responses:
        '200':
          description: Ceiling changed or an identical operation replayed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetCeiling'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/attachments:
    post:
      tags: [Attachments]
      operationId: createAttachment
      summary: Create one scoped immutable attachment upload.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAttachment'}
      responses:
        '201':
          description: Attachment metadata accepted. Content is not complete.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Attachment'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /v1/attachments/{attachment_id}:
    parameters:
      - name: attachment_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/OpaqueId'}
    get:
      tags: [Attachments]
      operationId: getAttachment
      summary: Get scoped attachment metadata.
      responses:
        '200':
          description: Attachment metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Attachment'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/attachments/{attachment_id}/content:
    parameters:
      - name: attachment_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/OpaqueId'}
    put:
      tags: [Attachments]
      operationId: putAttachmentContent
      summary: Upload the exact declared attachment bytes once.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, maxLength: 26214400}
      responses:
        '200':
          description: Content verified and made immutable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Attachment'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    get:
      tags: [Attachments]
      operationId: getAttachmentContent
      summary: Read scoped immutable attachment content.
      responses:
        '200':
          description: Exact immutable bytes. The response uses Cache-Control no-store.
          headers:
            Digest:
              schema: {type: string, pattern: '^sha-256=:[A-Za-z0-9+/]+={0,2}:$'}
          content:
            application/octet-stream:
              schema: {type: string, format: binary, maxLength: 26214400}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/model-requests:
    get:
      tags: [Requests]
      operationId: listModelRequests
      summary: Discover bounded model-request status records in the authenticated scope.
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {$ref: '#/components/responses/RequestStatusPage'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Requests]
      operationId: createModelRequest
      summary: Admit one provider-neutral model request.
      parameters:
        - $ref: '#/components/parameters/LogicalRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelRequest'}
      responses:
        '200': {$ref: '#/components/responses/AdmissionReplay'}
        '201': {$ref: '#/components/responses/AdmissionCreated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/Retryable'}
        '503': {$ref: '#/components/responses/Retryable'}
  /v1/model-requests/{request_id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Requests]
      operationId: getModelRequest
      summary: Recover the current or terminal request status.
      responses:
        '200': {$ref: '#/components/responses/RequestStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/model-requests/{request_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Requests]
      operationId: cancelModelRequest
      summary: Request idempotent best-effort cancellation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRequest'}
      responses:
        '200': {$ref: '#/components/responses/RequestStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/model-requests/{request_id}/events:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/LastEventId'
    get:
      tags: [Requests]
      operationId: streamModelRequest
      summary: Read native stream protocol version 1 events.
      responses:
        '200':
          description: Server-sent events defined in stream-protocol.md.
          content:
            text/event-stream:
              schema: {type: string}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/services/{service_id}/workspaces/{workspace_id}/embedding-requests:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Embeddings]
      operationId: createEmbeddingRequest
      summary: Admit one atomic workspace-scoped embedding batch.
      parameters:
        - $ref: '#/components/parameters/LogicalRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmbeddingRequest'}
      responses:
        '200': {$ref: '#/components/responses/EmbeddingAdmissionReplay'}
        '201': {$ref: '#/components/responses/EmbeddingAdmissionCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/Retryable'}
        '503': {$ref: '#/components/responses/Retryable'}
  /v1/services/{service_id}/workspaces/{workspace_id}/embedding-requests/{request_id}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Embeddings]
      operationId: getEmbeddingRequest
      summary: Get one scoped embedding batch status and its atomic result.
      responses:
        '200': {$ref: '#/components/responses/EmbeddingStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/agent-runs:
    get:
      tags: [Runs]
      operationId: listAgentRuns
      summary: Discover bounded agent-run status records in the authenticated scope.
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {$ref: '#/components/responses/RequestStatusPage'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Runs]
      operationId: createAgentRun
      summary: Admit one durable provider-neutral agent run.
      parameters:
        - $ref: '#/components/parameters/LogicalRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentRunRequest'}
      responses:
        '200': {$ref: '#/components/responses/AdmissionReplay'}
        '201': {$ref: '#/components/responses/AdmissionCreated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Retryable'}
  /v1/agent-runs/{request_id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Runs]
      operationId: getAgentRun
      summary: Recover one agent-run status.
      responses:
        '200': {$ref: '#/components/responses/RequestStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/agent-runs/{request_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Runs]
      operationId: cancelAgentRun
      summary: Request idempotent best-effort cancellation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRequest'}
      responses:
        '200': {$ref: '#/components/responses/RequestStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/agent-runs/{request_id}/events:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/LastEventId'
    get:
      tags: [Runs]
      operationId: streamAgentRun
      summary: Read native stream protocol version 1 events.
      responses:
        '200':
          description: Server-sent events defined in stream-protocol.md.
          content:
            text/event-stream:
              schema: {type: string}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/shared-tool-requests:
    get:
      tags: [Tools]
      operationId: listSharedToolRequests
      summary: Discover bounded shared-tool status records in the authenticated scope.
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {$ref: '#/components/responses/RequestStatusPage'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Tools]
      operationId: createSharedToolRequest
      summary: Admit one routed search, extraction, scrape, or screenshot request.
      parameters:
        - $ref: '#/components/parameters/LogicalRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SharedToolRequest'}
      responses:
        '200': {$ref: '#/components/responses/AdmissionReplay'}
        '201': {$ref: '#/components/responses/AdmissionCreated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Retryable'}
  /v1/shared-tool-requests/{request_id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Tools]
      operationId: getSharedToolRequest
      summary: Recover one shared-tool request status.
      responses:
        '200': {$ref: '#/components/responses/RequestStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/shared-tool-requests/{request_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Tools]
      operationId: cancelSharedToolRequest
      summary: Request idempotent best-effort cancellation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRequest'}
      responses:
        '200': {$ref: '#/components/responses/RequestStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/chat/completions:
    post:
      tags: [Requests]
      operationId: createChatCompletion
      summary: Run the accepted OpenAI-compatible chat completion operation.
      parameters:
        - $ref: '#/components/parameters/LogicalRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompatibleChatRequest'}
      responses:
        '200':
          description: Compatible completion or event stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompatibleResponse'}
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /v1/responses:
    post:
      tags: [Requests]
      operationId: createCompatibleResponse
      summary: Run the accepted OpenAI-compatible response operation.
      parameters:
        - $ref: '#/components/parameters/LogicalRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompatibleResponsesRequest'}
      responses:
        '200':
          description: Compatible response or event stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompatibleResponse'}
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /v1/services/{service_id}/effective-configuration:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Configuration]
      operationId: getEffectiveConfiguration
      summary: Get effective configuration with source and active revision.
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
      responses:
        '200':
          description: Effective configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EffectiveConfiguration'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/services/{service_id}/state:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Administration]
      operationId: getScopedAdministrationState
      summary: Get one authorized service or workspace lifecycle state.
      security: [{administratorSession: []}]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
      responses:
        '200':
          description: Exact service or workspace state without retained content.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScopedAdministrationState'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/admin/services/{service_id}/assignments:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Administration]
      operationId: listScopedAdministrationAssignments
      summary: List bounded effective assignments for one authorized scope.
      security: [{administratorSession: []}]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Bounded effective assignment page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdministrationAssignmentPage'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/services/{service_id}/assignments/{assignment_name}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
      - name: assignment_name
        in: path
        required: true
        schema: {$ref: '#/components/schemas/AssignmentName'}
    put:
      tags: [Administration]
      operationId: putScopedAdministrationAssignment
      summary: Publish one complete ordered assignment fallback chain.
      security: [{administratorSession: []}]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdministrationPutAssignment'}
      responses:
        '200': {$ref: '#/components/responses/ConfigurationWrite'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /v1/admin/services/{service_id}/provider-instances:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Administration]
      operationId: listScopedAdministrationProviderInstances
      summary: List bounded effective provider instances for one service.
      security: [{administratorSession: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Bounded effective provider-instance page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdministrationProviderInstancePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Administration]
      operationId: createScopedAdministrationProviderInstance
      summary: Create and publish one service-owned OpenRouter instance.
      security: [{administratorSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdministrationPutProviderInstance'}
      responses:
        '200': {$ref: '#/components/responses/ConfigurationWrite'}
        '201': {$ref: '#/components/responses/ConfigurationWrite'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /v1/admin/services/{service_id}/provider-instances/{provider_instance_id}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
      - name: provider_instance_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/OpaqueId'}
    put:
      tags: [Administration]
      operationId: putScopedAdministrationProviderInstance
      summary: Replace, disable, or restore one service-owned OpenRouter instance.
      security: [{administratorSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdministrationPutProviderInstance'}
      responses:
        '200': {$ref: '#/components/responses/ConfigurationWrite'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /v1/admin/services/{service_id}/provider-model-routes:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Administration]
      operationId: listScopedAdministrationProviderModelRoutes
      summary: List bounded effective provider-model routes for one service.
      security: [{administratorSession: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Bounded effective provider-model route page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdministrationProviderModelRoutePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Administration]
      operationId: createScopedAdministrationProviderModelRoute
      summary: Create and publish one service-owned provider-model route.
      security: [{administratorSession: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdministrationPutProviderModelRoute'}
      responses:
