        schema_major_version: {type: integer, minimum: 1}
    MetadataEntries:
      type: array
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required: [key, value]
        properties:
          key: {type: string, minLength: 1, maxLength: 100}
          value: {type: string, maxLength: 1000}
