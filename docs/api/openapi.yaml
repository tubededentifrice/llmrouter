        outputs:
          type: array
          maxItems: 100
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [type, text]
                properties:
                  type: {type: string, const: text}
                  text: {type: string}
              - type: object
                additionalProperties: false
                required: [type, document]
                properties:
                  type: {type: string, enum: [json, tool_result]}
                  document: {$ref: '#/components/schemas/RegisteredDocument'}
