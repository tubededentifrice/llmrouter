        affected_scope: {type: string, enum: [attempt, provider_model_route, provider_instance, credential, assignment_candidate, logical_request]}
        message: {type: string, maxLength: 1000}
        safe_provider_code: {type: string, maxLength: 200}
    RequestAccounting:
      type: object
      additionalProperties: false
      required: [estimated, reserved, used, corrected, currency]
      properties:
        estimated: {$ref: '#/components/schemas/NonNegativeDecimal'}
        reserved: {$ref: '#/components/schemas/NonNegativeDecimal'}
        used: {$ref: '#/components/schemas/NonNegativeDecimal'}
        corrected: {$ref: '#/components/schemas/NonNegativeDecimal'}
