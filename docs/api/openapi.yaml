openapi: 3.1.0
info:
  title: LLM Router native API
  version: 1.0.0
  description: Provider-neutral service and global administration contract.
servers:
  - url: /
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Get the public health summary.
      security: []
      responses:
        "200":
          description: Health summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSummary"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/metrics:
    get:
      operationId: getMetrics
      summary: Get Prometheus metrics for deployment monitoring.
      security: []
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces in the service.
      security:
        - serviceKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Workspace page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePage"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createWorkspace
      summary: Create a workspace in the service.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreate"
      responses:
        "201":
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/workspaces/{workspace_api_name}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceApiName"
    get:
      operationId: getWorkspace
      summary: Get one workspace in the service.
      security:
        - serviceKey: []
      responses:
        "200":
          description: Workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace and its Router data.
      security:
        - serviceKey: []
      responses:
        "204":
          description: Workspace deleted.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/assignments:
    get:
      operationId: listAssignments
      summary: List service assignments.
      security:
        - serviceKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentPage"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/assignments/{assignment_api_name}/observed-requirements/{observed_requirement}:
    parameters:
      - $ref: "#/components/parameters/AssignmentApiName"
      - $ref: "#/components/parameters/ObservedRequirement"
    delete:
      operationId: removeObservedAssignmentRequirement
      summary: Remove one observed requirement from a service assignment.
      security:
        - serviceKey: []
      responses:
        "204":
          description: Observed requirement removed.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/assignments/{assignment_api_name}:
    parameters:
      - $ref: "#/components/parameters/AssignmentApiName"
    get:
      operationId: getAssignment
      summary: Get one service assignment.
      security:
        - serviceKey: []
      responses:
        "200":
          description: Assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: putAssignment
      summary: Create or replace one service assignment.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentWrite"
      responses:
        "200":
          description: Assignment saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteAssignment
      summary: Delete one service assignment.
      security:
        - serviceKey: []
      responses:
        "204":
          description: Assignment deleted.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/model-calls:
    post:
      operationId: createModelCall
      summary: Make one synchronous model call.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCallRequest"
      responses:
        "200":
          description: Model result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCallResult"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/model-streams:
    post:
      operationId: createModelStream
      summary: Make one streaming model call.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCallRequest"
      responses:
        "200":
          description: Server-sent model stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/embeddings:
    post:
      operationId: createEmbedding
      summary: Make one synchronous embedding call.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingRequest"
      responses:
        "200":
          description: Embedding result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingResult"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/media-jobs:
    post:
      operationId: createMediaJob
      summary: Start one image, video, or audio generation job.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaJobRequest"
      responses:
        "202":
          description: Media job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJob"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/media-jobs/{media_job_id}:
    parameters:
      - $ref: "#/components/parameters/MediaJobId"
    get:
      operationId: getMediaJob
      summary: Get one media job.
      security:
        - serviceKey: []
      responses:
        "200":
          description: Media job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJob"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/media-jobs/{media_job_id}/content:
    parameters:
      - $ref: "#/components/parameters/MediaJobId"
    get:
      operationId: getMediaJobContent
      summary: Read generated media through the Router.
      security:
        - serviceKey: []
      responses:
        "200":
          description: Generated media bytes.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/statistics:
    get:
      operationId: getServiceStatistics
      summary: Get bounded service statistics.
      security:
        - serviceKey: []
      parameters:
        - $ref: "#/components/parameters/StatisticsFrom"
        - $ref: "#/components/parameters/StatisticsTo"
        - $ref: "#/components/parameters/WorkspaceFilter"
        - $ref: "#/components/parameters/AssignmentFilter"
        - $ref: "#/components/parameters/ProviderModelFilter"
        - $ref: "#/components/parameters/OutcomeFilter"
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/GroupBy"
      responses:
        "200":
          description: Statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsResult"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/provider-models:
    get:
      operationId: listAvailableProviderModels
      summary: List enabled provider-models that a service can select.
      security:
        - serviceKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Service-safe provider-model records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableProviderModelPage"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/service-keys:
    get:
      operationId: listServiceKeys
      summary: List key records for the authenticated service.
      security:
        - serviceKey: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Service keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceKeyPage"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createServiceKey
      summary: Create a long-lived key for the authenticated service.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceKeyCreate"
      responses:
        "201":
          description: Service key. The secret is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceKeyCreated"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/service-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    delete:
      operationId: revokeServiceKey
      summary: Revoke one key for the authenticated service.
      security:
        - serviceKey: []
      responses:
        "204":
          description: Service key revoked.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/session/start:
    post:
      operationId: startAdministratorSession
      summary: Start the Pocket ID sign-in flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdministratorSessionStart"
      responses:
        "200":
          description: Sign-in redirect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministratorSessionRedirect"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/session/callback:
    get:
      operationId: completeAdministratorSession
      summary: Complete the Pocket ID sign-in flow.
      security: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationCode"
        - $ref: "#/components/parameters/OidcState"
      responses:
        "200":
          description: Administrator session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministratorSession"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/session:
    get:
      operationId: getAdministratorSession
      summary: Get the current administrator session.
      security:
        - administratorSession: []
      responses:
        "200":
          description: Administrator session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministratorSession"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteAdministratorSession
      summary: End the current administrator session.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Session ended.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/services:
    get:
      operationId: adminListServices
      summary: List services.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Services.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePage"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: adminCreateService
      summary: Create a service.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCreate"
      responses:
        "201":
          description: Service created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/services/{service_api_name}:
    parameters:
      - $ref: "#/components/parameters/ServiceApiName"
    get:
      operationId: adminGetService
      summary: Get one service.
      security:
        - administratorSession: []
      responses:
        "200":
          description: Service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: adminPutService
      summary: Replace one service name and parent relationship.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Service saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: adminDeleteService
      summary: Delete one service and its Router data.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Service deleted.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/services/{service_api_name}/workspaces:
    parameters:
      - $ref: "#/components/parameters/ServiceApiName"
    get:
      operationId: adminListWorkspaces
      summary: List workspaces for one service.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Workspaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePage"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: adminCreateWorkspace
      summary: Create a workspace for one service.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreate"
      responses:
        "201":
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/services/{service_api_name}/workspaces/{workspace_api_name}:
    parameters:
      - $ref: "#/components/parameters/ServiceApiName"
      - $ref: "#/components/parameters/WorkspaceApiName"
    get:
      operationId: adminGetWorkspace
      summary: Get one workspace for one service.
      security:
        - administratorSession: []
      responses:
        "200":
          description: Workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: adminDeleteWorkspace
      summary: Delete one workspace and its Router data.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Workspace deleted.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/services/{service_api_name}/keys:
    parameters:
      - $ref: "#/components/parameters/ServiceApiName"
    get:
      operationId: adminListServiceKeys
      summary: List service key records.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Service keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceKeyPage"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: adminCreateServiceKey
      summary: Create a long-lived service key.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceKeyCreate"
      responses:
        "201":
          description: Service key. The secret is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceKeyCreated"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/services/{service_api_name}/keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/ServiceApiName"
      - $ref: "#/components/parameters/KeyId"
    delete:
      operationId: adminRevokeServiceKey
      summary: Revoke one service key.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Service key revoked.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/services/{service_api_name}/assignments:
    parameters:
      - $ref: "#/components/parameters/ServiceApiName"
    get:
      operationId: adminListAssignments
      summary: List assignments for one service.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentPage"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/services/{service_api_name}/assignments/{assignment_api_name}:
    parameters:
      - $ref: "#/components/parameters/ServiceApiName"
      - $ref: "#/components/parameters/AssignmentApiName"
    get:
      operationId: adminGetAssignment
      summary: Get one service assignment.
      security:
        - administratorSession: []
      responses:
        "200":
          description: Assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: adminPutAssignment
      summary: Create or replace one service assignment.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentWrite"
      responses:
        "200":
          description: Assignment saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: adminDeleteAssignment
      summary: Delete one service assignment.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Assignment deleted.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/services/{service_api_name}/assignments/{assignment_api_name}/observed-requirements/{observed_requirement}:
    parameters:
      - $ref: "#/components/parameters/ServiceApiName"
      - $ref: "#/components/parameters/AssignmentApiName"
      - $ref: "#/components/parameters/ObservedRequirement"
    delete:
      operationId: adminRemoveObservedAssignmentRequirement
      summary: Remove one observed requirement from a service assignment.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Observed requirement removed.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/providers:
    get:
      operationId: adminListProviders
      summary: List global provider connections.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderPage"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: adminCreateProvider
      summary: Create a global provider connection.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderWrite"
      responses:
        "201":
          description: Provider created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/providers/{provider_api_name}:
    parameters:
      - $ref: "#/components/parameters/ProviderApiName"
    get:
      operationId: adminGetProvider
      summary: Get one global provider connection.
      security:
        - administratorSession: []
      responses:
        "200":
          description: Provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: adminPutProvider
      summary: Replace one global provider connection.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderWrite"
      responses:
        "200":
          description: Provider saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: adminDeleteProvider
      summary: Delete one global provider connection.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Provider deleted.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/models:
    get:
      operationId: adminListModels
      summary: List global models.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPage"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: adminCreateModel
      summary: Create a global model.
      security:
        - administratorSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelWrite"
      responses:
        "201":
          description: Model created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/admin/models/{model_api_name}:
    parameters:
      - $ref: "#/components/parameters/ModelApiName"
    get:
      operationId: adminGetModel
      summary: Get one global model.
      security:
        - administratorSession: []
      responses:
        "200":
