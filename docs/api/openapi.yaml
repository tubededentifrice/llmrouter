      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/RequestStatus'}}
        next_cursor: {type: [string, 'null']}
    AdministrationRequestStatus:
      type: object
      additionalProperties: false
