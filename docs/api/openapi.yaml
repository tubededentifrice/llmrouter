      required: [request_id, service_id, workspace_id, exact_route, route_configuration_revision, authorization_expires_at, state, phases, status_url]
      properties:
        request_id: {$ref: '#/components/schemas/UuidV7'}
        service_id: {$ref: '#/components/schemas/OpaqueId'}
        workspace_id:
          oneOf: [{$ref: '#/components/schemas/OpaqueId'}, {type: 'null'}]
        exact_route: {$ref: '#/components/schemas/OpaqueId'}
        route_configuration_revision: {$ref: '#/components/schemas/OpaqueId'}
        authorization_expires_at: {$ref: '#/components/schemas/Timestamp'}
        state: {type: string, enum: [active, succeeded, failed, expired]}
        phases:
          type: array
          minItems: 5
          maxItems: 5
          items: {$ref: '#/components/schemas/AdministrationDiagnosticPhase'}
        failure_class:
          type: string
          enum: [authentication, policy, budget, rate_limit, timeout, transport, provider_unavailable, invalid_provider_response, incompatible_request, cancelled, uncertain_effect, router_internal]
        status_url: {type: string, format: uri-reference}
    EmbeddingRequestState:
      type: string
      enum: [admitted, running, succeeded, failed]
    EmbeddingAdmissionReceipt:
      type: object
      additionalProperties: false
      required: [request_id, admitted_at, state, state_revision, status_url, fingerprint_version, capture_enabled, capture_reason, capture_expires_at]
      properties:
        request_id: {$ref: '#/components/schemas/UuidV7'}
        admitted_at: {$ref: '#/components/schemas/Timestamp'}
        state: {$ref: '#/components/schemas/EmbeddingRequestState'}
        state_revision: {type: integer, minimum: 1}
        status_url: {type: string, format: uri}
        fingerprint_version: {type: string, const: rfc8785-sha256-v1}
        capture_enabled: {type: boolean}
        capture_reason: {type: string, enum: [configured, spool_pressure]}
        capture_expires_at: {$ref: '#/components/schemas/Timestamp'}
    EmbeddingRequestStatus:
      type: object
      additionalProperties: false
      description: The uncompressed JSON response contains no more than 8388608 bytes.
      required: [request_id, service_id, workspace_id, state, state_revision, admitted_at, last_transition_at, assignment, input_policy_id, model_space_id, dimensions, admission, accounting]
      oneOf:
        - required: [terminal_at, result]
          properties:
            state: {const: succeeded}
          not:
            required: [error]
        - required: [terminal_at, error]
          properties:
            state: {const: failed}
          not:
            required: [result]
        - properties:
            state: {enum: [admitted, running]}
          not:
            anyOf:
              - required: [terminal_at]
              - required: [result]
              - required: [error]
      properties:
        request_id: {$ref: '#/components/schemas/UuidV7'}
        service_id: {$ref: '#/components/schemas/OpaqueId'}
        workspace_id: {$ref: '#/components/schemas/OpaqueId'}
        state: {$ref: '#/components/schemas/EmbeddingRequestState'}
        state_revision: {type: integer, minimum: 1}
        admitted_at: {$ref: '#/components/schemas/Timestamp'}
        last_transition_at: {$ref: '#/components/schemas/Timestamp'}
        terminal_at: {$ref: '#/components/schemas/Timestamp'}
        assignment: {$ref: '#/components/schemas/AssignmentName'}
        input_policy_id: {$ref: '#/components/schemas/OpaqueId'}
        model_space_id: {$ref: '#/components/schemas/OpaqueId'}
        dimensions: {type: integer, minimum: 1, maximum: 4096}
        admission: {$ref: '#/components/schemas/EmbeddingAdmissionReceipt'}
        result:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: '#/components/schemas/EmbeddingVector'}
        error: {$ref: '#/components/schemas/TerminalError'}
        accounting: {$ref: '#/components/schemas/EmbeddingAccounting'}
    EmbeddingVector:
      type: object
      additionalProperties: false
      required: [input_id, vector]
      properties:
        input_id: {$ref: '#/components/schemas/OpaqueId'}
        vector:
          type: array
          minItems: 1
          maxItems: 4096
          items: {type: number, format: double, x-finite: true}
    EmbeddingAccounting:
      type: object
      additionalProperties: false
      required: [input_count, input_utf8_bytes, provider_attempts, usage, cost]
      properties:
        input_count: {type: integer, minimum: 1, maximum: 32}
        input_utf8_bytes: {type: integer, minimum: 1, maximum: 262144}
        provider_attempts: {type: integer, minimum: 0, maximum: 4}
        usage: {type: array, items: {$ref: '#/components/schemas/UsageComponent'}}
        cost: {$ref: '#/components/schemas/RequestAccounting'}
    TerminalError:
