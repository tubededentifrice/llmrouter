        warning_threshold:
          oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]
        host_ceiling: {$ref: '#/components/schemas/Money'}
        reserved: {$ref: '#/components/schemas/Money'}
        used: {$ref: '#/components/schemas/Money'}
        corrected: {$ref: '#/components/schemas/SignedMoney'}
        remaining: {$ref: '#/components/schemas/Money'}
        enforcement_state: {type: string, enum: [available, warning, exhausted, allowance_unavailable]}
        reset_period: {type: string, enum: [none, daily, monthly]}
        revision: {$ref: '#/components/schemas/BudgetRevision'}
    BudgetLimitWriteResult:
      type: object
      additionalProperties: false
      required: [scope, limit, warning_threshold, reset_period, revision, effective_at]
      properties:
        scope: {type: string, enum: [service, workspace]}
        limit: {$ref: '#/components/schemas/Money'}
        warning_threshold:
          oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]
        reset_period: {type: string, enum: [none, daily, monthly]}
        revision: {$ref: '#/components/schemas/BudgetRevision'}
        effective_at: {$ref: '#/components/schemas/Timestamp'}
    PutAssignment:
      type: object
      additionalProperties: false
