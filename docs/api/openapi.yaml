        credentials or retained request content.
      security:
        - embedSession: []
      parameters:
        - name: service_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/OpaqueId'}
        - $ref: '#/components/parameters/WorkspaceIdQuery'
      responses:
        '200':
          description: The bounded sections permitted by the current embed session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmbedAdministrationSnapshot'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
