    RequestLogSummary:
      type: object
      additionalProperties: false
      required: [id, logical_call_id, call_actor, kind, outcome, started_at]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        logical_call_id:
          $ref: "#/components/schemas/OpaqueId"
        call_actor:
          $ref: "#/components/schemas/CallActor"
        service_api_name:
          $ref: "#/components/schemas/ApiName"
        workspace_api_name:
          $ref: "#/components/schemas/ApiName"
        administrator_subject:
          type: string
          minLength: 1
          maxLength: 500
        configuration_service_api_name:
          $ref: "#/components/schemas/ApiName"
        assignment_api_name:
          $ref: "#/components/schemas/AssignmentName"
        provider_model_api_name:
          $ref: "#/components/schemas/ApiName"
        kind:
          type: string
          enum: [model, embedding, media]
        outcome:
          $ref: "#/components/schemas/Outcome"
        tags:
          $ref: "#/components/schemas/Tags"
        started_at:
          $ref: "#/components/schemas/Timestamp"
      oneOf:
        - required: [call_actor, service_api_name, workspace_api_name]
          properties:
            call_actor:
              const: service
          not:
            anyOf:
              - required: [administrator_subject]
              - required: [configuration_service_api_name]
        - required:
            - call_actor
            - administrator_subject
            - provider_model_api_name
          properties:
            call_actor:
              const: administrator
          not:
            anyOf:
              - required: [service_api_name]
              - required: [workspace_api_name]
              - required: [assignment_api_name]
              - required: [configuration_service_api_name]
        - required:
            - call_actor
            - administrator_subject
            - assignment_api_name
            - configuration_service_api_name
          properties:
            call_actor:
              const: administrator
          not:
            anyOf:
              - required: [service_api_name]
              - required: [workspace_api_name]
    RequestLog:
      type: object
      additionalProperties: false
      required: [summary, request_json, attempts]
      properties:
        summary:
          $ref: "#/components/schemas/RequestLogSummary"
        request_json:
          type: string
          maxLength: 5000000
        response_json:
          type: string
          maxLength: 10000000
        attempts:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/RequestAttempt"
        media:
          type: array
          items:
            $ref: "#/components/schemas/LogMedia"
    RequestAttempt:
      type: object
      additionalProperties: false
      required:
        - provider_model_api_name
