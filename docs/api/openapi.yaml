          minLength: 1
          maxLength: 200
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
          maxLength: 1000
        details:
          $ref: "#/components/schemas/ErrorDetails"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    ConfigurationDeletionValidationErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              const: invalid_request
            message:
              const: Configuration deletion validation failed.
    ConfigurationDeletionTargetNotFoundErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              const: not_found
            message:
              const: Configuration deletion target was not found.
    ConfigurationDeletionConflictErrorEnvelope:
      oneOf:
        - type: object
          additionalProperties: false
          required: [error]
          properties:
            error:
              type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code:
                  const: conflict
                message:
                  const: Configuration deletion confirmation is expired or was already used.
        - type: object
          additionalProperties: false
          required: [error]
          properties:
            error:
              type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code:
                  const: conflict
                message:
                  const: Configuration changed after the deletion preview. Create a new preview.
    ConfigurationDeletionStorageErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              const: internal_error
            message:
              const: Configuration deletion was not applied.
    AdministratorErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
        logical_call_id:
          $ref: "#/components/schemas/OpaqueId"
        selector:
          $ref: "#/components/schemas/AdministratorModelSelector"
        elapsed_ms:
          $ref: "#/components/schemas/ConnectionElapsedMilliseconds"
        attempts:
          $ref: "#/components/schemas/ConnectionAdministratorAttemptResults"
      oneOf:
        - not:
            anyOf:
              - required: [logical_call_id]
              - required: [selector]
              - required: [elapsed_ms]
              - required: [attempts]
        - required: [logical_call_id, selector, elapsed_ms, attempts]
          oneOf:
            - properties:
                selector:
                  $ref: "#/components/schemas/AdministratorAssignmentSelector"
            - properties:
                selector:
                  $ref: "#/components/schemas/ExactProviderModelSelector"
                attempts:
                  $ref: "#/components/schemas/ExactConnectionAdministratorAttemptResults"
    HealthStatus:
      type: string
      enum: [healthy, degraded, unavailable]
    HealthSummary:
      type: object
      additionalProperties: false
      required: [status, checked_at]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        checked_at:
          $ref: "#/components/schemas/Timestamp"
    WorkspaceCreate:
      type: object
